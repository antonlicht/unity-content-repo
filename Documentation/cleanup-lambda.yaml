AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Content Repo — daily cleanup Lambda.
  Reads every <generation>/delete-schedule.json in the bucket, deletes build folders whose
  deleteAfter date has passed and which are no longer referenced by the staging or production
  manifest, then updates the schedule file. Runs once per day via EventBridge.

Parameters:
  BucketName:
    Type: String
    Description: S3 bucket that holds content builds and manifests.
  Region:
    Type: String
    Description: AWS region where the bucket lives (Lambda must be in the same region).
  StagingPrefix:
    Type: String
    Default: staging
    Description: Folder of the staging manifest inside each generation (<generation>/<prefix>/manifest.json).
  ProductionPrefix:
    Type: String
    Default: production
    Description: Folder of the production manifest inside each generation (<generation>/<prefix>/manifest.json).

Resources:

  CleanupLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: content-repo-cleanup-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: content-repo-cleanup-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  - !Sub "arn:aws:s3:::${BucketName}"
                  - !Sub "arn:aws:s3:::${BucketName}/*"

  CleanupLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: content-repo-cleanup
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt CleanupLambdaRole.Arn
      Timeout: 300
      MemorySize: 256
      Environment:
        Variables:
          BUCKET_NAME: !Ref BucketName
          STAGING_PREFIX: !Ref StagingPrefix
          PRODUCTION_PREFIX: !Ref ProductionPrefix
      Code:
        ZipFile: |
          import boto3
          import json
          import os
          from datetime import datetime, timezone

          s3 = boto3.client("s3")
          BUCKET = os.environ["BUCKET_NAME"]
          MANIFESTS = [os.environ.get("STAGING_PREFIX", "staging"), os.environ.get("PRODUCTION_PREFIX", "production")]
          SUFFIX = "/delete-schedule.json"

          def read_json(key):
              return json.loads(s3.get_object(Bucket=BUCKET, Key=key)["Body"].read().decode("utf-8"))

          def handler(event, context):
              # Every folder with a delete-schedule.json is a generation (the default one is "gen/1").
              gens = []
              for page in s3.get_paginator("list_objects_v2").paginate(Bucket=BUCKET):
                  for obj in page.get("Contents", []):
                      key = obj["Key"]
                      if key.endswith(SUFFIX) and "/builds/" not in key:
                          gens.append(key[:-len(SUFFIX)])
              print(f"Generations: {gens}")
              for gen in gens:
                  try:
                      process(gen)
                  except Exception as e:
                      print(f"[{gen}] Failed: {e}")

          def is_due(e, now):
              try:
                  d = datetime.fromisoformat(str(e.get("deleteAfter") or "").replace("Z", "+00:00"))
              except ValueError:
                  return False
              return now >= (d if d.tzinfo else d.replace(tzinfo=timezone.utc))

          def process(gen):
              key = gen + SUFFIX
              schedule = read_json(key)
              entries = schedule.get("entries") or []

              # A missing manifest references nothing; one that cannot be read stops this generation.
              live = set()
              for env in MANIFESTS:
                  try:
                      manifest = read_json(f"{gen}/{env}/manifest.json")
                  except s3.exceptions.NoSuchKey:
                      continue
                  for pkg in manifest.get("contentPackages") or []:
                      for plat in (pkg or {}).get("platforms") or []:
                          live.add((plat or {}).get("buildId", ""))

              now = datetime.now(timezone.utc)
              removed = set()
              for e in entries:
                  bid = e.get("buildId", "") if isinstance(e, dict) else ""
                  if not bid or bid in live or not is_due(e, now):
                      continue
                  prefix = f"{gen}/builds/{bid}/{e.get('platform', '')}/{e.get('contentPackage', '')}/"
                  deleted, failed = delete_prefix(prefix)
                  print(f"[{gen}] Deleted {deleted} object(s) from {prefix}, {failed} failed")
                  if not failed:
                      removed.add(bid)

              # Re-read right before writing and drop only what was deleted, so entries added meanwhile are kept.
              if removed:
                  fresh = read_json(key)
                  fresh["entries"] = [e for e in fresh.get("entries") or [] if not (isinstance(e, dict) and e.get("buildId") in removed)]
                  s3.put_object(Bucket=BUCKET, Key=key, Body=json.dumps(fresh, indent=2).encode("utf-8"),
                                ContentType="application/json")

          def delete_prefix(prefix):
              deleted = failed = 0
              for page in s3.get_paginator("list_objects_v2").paginate(Bucket=BUCKET, Prefix=prefix):
                  objs = [{"Key": o["Key"]} for o in page.get("Contents", [])]
                  if objs:
                      errors = s3.delete_objects(Bucket=BUCKET, Delete={"Objects": objs}).get("Errors", [])
                      for err in errors:
                          print(f"  {err.get('Key')}: {err.get('Code')}")
                      failed += len(errors)
                      deleted += len(objs) - len(errors)
              return deleted, failed

  CleanupSchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: content-repo-cleanup-daily
      Description: Triggers the Content Repo cleanup Lambda once per day.
      ScheduleExpression: rate(1 day)
      State: ENABLED
      Targets:
        - Id: CleanupLambdaTarget
          Arn: !GetAtt CleanupLambda.Arn

  CleanupSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt CleanupLambda.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt CleanupSchedule.Arn

Outputs:
  LambdaArn:
    Value: !GetAtt CleanupLambda.Arn
    Description: ARN of the cleanup Lambda function.
  ScheduleArn:
    Value: !GetAtt CleanupSchedule.Arn
    Description: ARN of the daily EventBridge rule.
